<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430"
     font-family="Splunk Platform Sans, Roboto, Helvetica Neue, Arial, sans-serif">
  <!-- Dependency map for the KO History help page.
       Dark-theme colours are baked in: the panel renders this through <img>, so
       currentColor cannot inherit the dashboard's theme. Background is left
       transparent so the panel surface shows through. -->
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00cdaf"/>
    </marker>
    <marker id="arwm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c98a3"/>
    </marker>
  </defs>

  <!-- saved searches -->
  <rect x="330" y="10" width="320" height="52" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="490" y="33" text-anchor="middle" fill="#e1e6eb" font-size="15" font-weight="600">saved searches</text>
  <text x="490" y="51" text-anchor="middle" fill="#8c98a3" font-size="12">7 backups on a 15-min cron  ·  1 delete audit, hourly</text>

  <line x1="490" y1="62" x2="490" y2="104" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="502" y="88" fill="#8c98a3" font-size="11.5">one event per KO version or mutation</text>

  <!-- the index -->
  <rect x="300" y="106" width="380" height="56" rx="6" fill="#0d2b28" stroke="#00cdaf" stroke-width="1.4"/>
  <text x="490" y="130" text-anchor="middle" fill="#00cdaf" font-size="16" font-weight="700"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">index = ko_history</text>
  <text x="490" y="149" text-anchor="middle" fill="#7fd9c9" font-size="11.5">the single source of truth</text>

  <!-- fan-out rail -->
  <line x1="490" y1="162" x2="490" y2="188" stroke="#00cdaf" stroke-width="1.6"/>
  <line x1="150" y1="188" x2="830" y2="188" stroke="#00cdaf" stroke-width="1.6"/>
  <line x1="150" y1="188" x2="150" y2="222" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="490" y1="188" x2="490" y2="222" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="830" y1="188" x2="830" y2="222" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- three consumers -->
  <rect x="30" y="224" width="240" height="78" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="150" y="248" text-anchor="middle" fill="#e1e6eb" font-size="14" font-weight="600"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">ko_version_ds</text>
  <text x="150" y="267" text-anchor="middle" fill="#8c98a3" font-size="11.5">Dashboard Studio</text>
  <text x="150" y="288" text-anchor="middle" fill="#8c98a3" font-size="11.5">the data UI</text>

  <rect x="370" y="224" width="240" height="78" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="490" y="248" text-anchor="middle" fill="#e1e6eb" font-size="14" font-weight="600"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">ko_version</text>
  <text x="490" y="267" text-anchor="middle" fill="#8c98a3" font-size="11.5">Classic Simple XML</text>
  <text x="490" y="288" text-anchor="middle" fill="#8c98a3" font-size="11.5">alternate dashboard</text>

  <rect x="710" y="224" width="240" height="78" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="830" y="248" text-anchor="middle" fill="#e1e6eb" font-size="14" font-weight="600"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">wrapper</text>
  <text x="830" y="267" text-anchor="middle" fill="#8c98a3" font-size="11.5">React app page</text>
  <text x="830" y="288" text-anchor="middle" fill="#8c98a3" font-size="11.5">reads the index over REST</text>

  <!-- wrapper embeds ko_version_ds -->
  <path d="M710 274 C 560 274, 470 330, 300 330 L 278 330"
        fill="none" stroke="#8c98a3" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwm)"/>
  <text x="494" y="348" text-anchor="middle" fill="#8c98a3" font-size="11.5">embeds it in a same-origin iframe</text>

  <!-- viz belonging to ko_version_ds -->
  <line x1="150" y1="302" x2="150" y2="376" stroke="#3a444d" stroke-width="1.4"/>
  <line x1="150" y1="376" x2="176" y2="376" stroke="#3a444d" stroke-width="1.4"/>
  <rect x="176" y="358" width="230" height="38" rx="5" fill="#161c21" stroke="#2f373f"/>
  <text x="291" y="382" text-anchor="middle" fill="#a9b4bd" font-size="12"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">source_viewer viz</text>

  <text x="950" y="418" text-anchor="end" fill="#5c6970" font-size="11">Rename the index and all three surfaces need updating.</text>
</svg>
