<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     font-family="Splunk Platform Sans, Roboto, Helvetica Neue, Arial, sans-serif">
  <!-- The two one-way channels between the dashboard and the React wrapper.
       Break either and the wrapper goes inert, which is why this is drawn. -->
  <defs>
    <marker id="m_arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00cdaf"/>
    </marker>
    <marker id="m_arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dd9900"/>
    </marker>
  </defs>

  <text x="20" y="22" fill="#8c98a3" font-size="11" font-weight="700" letter-spacing="0.08em">CHANNEL 1  ·  SELECTION FLOWS DASHBOARD TO WRAPPER</text>

  <rect x="20" y="34" width="270" height="86" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="40" y="58" fill="#e1e6eb" font-size="13.5" font-weight="600"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">ko_version_ds</text>
  <text x="40" y="78" fill="#8c98a3" font-size="11.5">you click a row in the KO table</text>
  <text x="40" y="98" fill="#8c98a3" font-size="11.5">tokens update, the marker re-renders</text>
  <text x="40" y="114" fill="#5c6970" font-size="11">(Dashboard Studio, in an iframe)</text>

  <line x1="290" y1="77" x2="352" y2="77" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#m_arw)"/>

  <!-- the marker panel -->
  <rect x="354" y="34" width="330" height="86" rx="6" fill="#0d2b28" stroke="#00cdaf" stroke-width="1.4"/>
  <text x="370" y="56" fill="#00cdaf" font-size="12.5" font-weight="700"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">viz_link</text>
  <text x="428" y="56" fill="#7fd9c9" font-size="11">markdown panel, transparent font</text>
  <text x="370" y="78" fill="#e1e6eb" font-size="11"
        font-family="Splunk Platform Mono, SF Mono, Menlo, monospace">kohist-sel: title ⟪|⟫ app ⟪|⟫ class ⟪|⟫ epoch</text>
  <text x="370" y="98" fill="#8c98a3" font-size="11">invisible on screen, present in textContent</text>
  <text x="370" y="114" fill="#8c98a3" font-size="11">⟪|⟫ cannot occur in SPL or an object name</text>

  <line x1="684" y1="77" x2="746" y2="77" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#m_arw)"/>

  <rect x="748" y="34" width="212" height="86" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="768" y="58" fill="#e1e6eb" font-size="13.5" font-weight="600">wrapper reads it</text>
  <text x="768" y="78" fill="#8c98a3" font-size="11.5">on click, plus a 5s heartbeat</text>
  <text x="768" y="98" fill="#8c98a3" font-size="11.5">via textContent, never layout</text>
  <text x="768" y="114" fill="#5c6970" font-size="11">parsed by markerParse.js</text>

  <!-- empty-epoch note -->
  <rect x="354" y="132" width="606" height="34" rx="5" fill="#2b2419" stroke="#dd9900"/>
  <text x="370" y="154" fill="#f0c674" font-size="11.5">The epoch is empty until a version row is clicked, so every first click sends a trailing delimiter with nothing after it.</text>

  <line x1="20" y1="192" x2="960" y2="192" stroke="#2f373f"/>

  <text x="20" y="222" fill="#8c98a3" font-size="11" font-weight="700" letter-spacing="0.08em">CHANNEL 2  ·  PREVIEW, COMPARE AND RESTORE FLOW WRAPPER TO SPLUNK</text>

  <rect x="20" y="234" width="240" height="72" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="140" y="262" text-anchor="middle" fill="#e1e6eb" font-size="13.5" font-weight="600">wrapper</text>
  <text x="140" y="284" text-anchor="middle" fill="#8c98a3" font-size="11.5">authenticated REST,</text>
  <text x="140" y="300" text-anchor="middle" fill="#8c98a3" font-size="11.5">same origin</text>

  <path d="M260 258 L340 258" stroke="#00cdaf" stroke-width="1.6" marker-end="url(#m_arw)"/>
  <path d="M260 288 L340 288" stroke="#dd9900" stroke-width="1.6" marker-end="url(#m_arw2)"/>

  <!-- preview path -->
  <rect x="342" y="228" width="618" height="64" rx="6" fill="#161c21" stroke="#2f373f"/>
  <text x="360" y="250" fill="#00cdaf" font-size="12" font-weight="700">PREVIEW &amp; COMPARE</text>
  <text x="360" y="270" fill="#8c98a3" font-size="11.5">writes the snapshot into scratch slot views
    <tspan font-family="Splunk Platform Mono, SF Mono, Menlo, monospace" fill="#a9b4bd">kohist_cmp_baseline_&lt;user&gt;</tspan> /
    <tspan font-family="Splunk Platform Mono, SF Mono, Menlo, monospace" fill="#a9b4bd">_target_&lt;user&gt;</tspan></text>
  <text x="360" y="286" fill="#8c98a3" font-size="11.5">then iframes them. Per-user, so two admins never collide. Your real objects are untouched.</text>

  <!-- restore path -->
  <rect x="342" y="300" width="618" height="58" rx="6" fill="#2b2419" stroke="#dd9900"/>
  <text x="360" y="322" fill="#dd9900" font-size="12" font-weight="700">RESTORE</text>
  <text x="360" y="342" fill="#e8d5a8" font-size="11.5">writes a REAL object into whichever app you choose. Needs write access there. This is the only destructive path.</text>

  <rect x="20" y="376" width="940" height="78" rx="6" fill="#1b2228" stroke="#3a444d"/>
  <text x="40" y="400" fill="#e1e6eb" font-size="12.5" font-weight="600">What breaks the contract</text>
  <text x="40" y="422" fill="#8c98a3" font-size="11.5">Deleting the viz_link panel  ·  renaming link_title, link_app, ko_class or time  ·  changing the kohist-sel prefix or the ⟪|⟫ delimiter.</text>
  <text x="40" y="442" fill="#8c98a3" font-size="11.5">Any of these leaves the wrapper unable to tell what you selected, with no error: it simply stops responding to clicks.</text>
</svg>
