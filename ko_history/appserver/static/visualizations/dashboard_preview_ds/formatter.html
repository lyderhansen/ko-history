<form class="splunk-formatter-section" section-label="Data">

    <splunk-control-group label="Source Field" help="Column containing the raw dashboard source (eai:data envelope). Required.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.dataField" value="data">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Role Field" help="Column tagging each row baseline/target. If absent: first row = baseline, last row = target.">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.roleField" value="role">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Baseline Value" help="Role-field value marking the OLD version (compared against).">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.baselineValue" value="baseline">
        </splunk-text-input>
    </splunk-control-group>

    <splunk-control-group label="Target Value" help="Role-field value marking the NEW version (drawn + highlighted).">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.targetValue" value="target">
        </splunk-text-input>
    </splunk-control-group>

</form>

<form class="splunk-formatter-section" section-label="Display">

    <splunk-control-group label="Split View" help="Show baseline and target side by side (two columns) instead of only the target. Needs a baseline.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSplit" value="false">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Live Render (Studio)" help="Render the real Dashboard Studio components instead of the schematic. Studio targets only; heavier to load.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showLive" value="false">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Live Sample Data" help="Fill live-rendered panels with synthetic sample values so charts/single-values show data. Off = honest data-less (no values). No search is ever run either way.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.liveMock" value="true">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Panel Labels" help="Show panel titles and visualization types inside the schematic boxes.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showLabels" value="true">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Change List" help="Show the structural change summary in the side drawer.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showChangeList" value="true">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Source Diff" help="Show a line-by-line diff of the two source definitions in the side drawer.">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.showSourceDiff" value="false">
            <option value="true">On</option>
            <option value="false">Off</option>
        </splunk-radio-input>
    </splunk-control-group>

    <splunk-control-group label="Background" help="Background color of the schematic area.">
        <splunk-color-picker name="{{VIZ_NAMESPACE}}.background" type="custom" value="transparent">
            <splunk-color>transparent</splunk-color>
            <splunk-color>#0b0c10</splunk-color>
            <splunk-color>#111317</splunk-color>
            <splunk-color>#1a1a2e</splunk-color>
            <splunk-color>#ffffff</splunk-color>
        </splunk-color-picker>
    </splunk-control-group>

</form>
