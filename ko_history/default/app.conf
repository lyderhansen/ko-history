[id]
name = ko_history
version = 1.2.1

[install]
# The app works on install: capture and version history need no configuration,
# and restore is opt-in with a safe default (off). Must stay false: AppInspect
# fails a submitted app that ships is_configured = true, because it claims a
# setup already ran.
is_configured = false
build = 113

# NO state_change_requires_restart HERE, though this app genuinely does need a
# restart (Mako templates + static bundles resolve at appserver start).
# AppInspect has a dedicated check forbidding it: "forces a Splunk restart on
# every state change. Remove state_change_requires_restart and use specific
# reload triggers in the [triggers] stanza instead." It reports as a
# future_failure today and becomes a hard failure, so a Splunkbase app cannot
# ask Splunk to raise the restart prompt for it. The restart notice on ko_home
# and in DEPLOY.md is the substitute. Tested on build 107; do not re-add.

# Custom conf files need a reload trigger, or Splunk asks for a restart every
# time the settings page saves. 'simple' reloads the stanza in place, which is
# all ko_history.conf needs: it is read over REST at page load, and nothing
# caches it in splunkd.
[triggers]
reload.ko_history = simple

[package]
id = ko_history
check_for_updates = false

[ui]
is_visible = true
label = KO History
# Deliberately no setup_view. It would add a Set up button in Manage Apps, but
# it only works alongside is_configured = false, and that combination makes
# Splunk redirect EVERY user to the setup page until someone saves it. Non-admin
# users get the settings page read-only, so they would be stuck in that redirect
# with no way out. The nav entry reaches the same page without that trap.

[launcher]
author = Community
description = Captures and versions Splunk knowledge objects (dashboards, reports, alerts, macros, event types, field extractions) via summary indexing so admins can audit changes and recover content after accidental deletes, overwrites, or moves. Bundles custom visualizations and a React app page for inline, visual version-history diffs and change overlays. All seven object types are captured and can be previewed and compared. One-click restore covers dashboards and saved searches, and ships disabled: an admin enables it per object type on the app's settings page.
version = 1.2.1
