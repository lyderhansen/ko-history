[launcher]
author = Community
description = Captures and versions Splunk knowledge objects (dashboards, reports, alerts, macros, event types, field extractions) via summary indexing so admins can audit changes and recover content after accidental deletes, overwrites, or moves. Bundles custom visualizations and a React app page for inline, visual version-history diffs and change overlays. All seven object types are captured and can be previewed and compared; one-click restore currently covers dashboards and saved searches.
