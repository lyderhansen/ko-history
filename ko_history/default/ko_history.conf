# KO History app settings.
#
# Do not edit this file. Copy the stanza you want into
# $SPLUNK_HOME/etc/apps/ko_history/local/ko_history.conf, or use the KO History
# settings page (Settings in the KO History app nav), which writes local for you
# and is the only option on Splunk Cloud.

[restore]
# Restore is the one destructive thing KO History can do: it writes a captured
# version back into a real knowledge object in whichever app you choose. It is
# therefore OFF for every object type until an admin turns it on.
#
# Capture, version history, preview and compare are unaffected by these
# settings and work with everything off.
#
# 1 enables restore for that object type, 0 disables it.

# Shipped and testable today.
dashboard = 0
savedsearch = 0

# Restore is implemented for the five types below but has not had a test pass,
# so the app ignores these keys and the settings page shows them as greyed-out
# placeholders. Setting them to 1 by hand does nothing. They become live in a
# future release.
macro = 0
eventtype = 0
fieldextraction = 0
lookup = 0
tag = 0
