# ─── Lookups (Phase 3) ─────────────────────────────────────────────────
#
# The lookup DEFINITIONS (Settings > Lookups > Lookup definitions), i.e.
# /data/transforms/lookups — NOT the raw .csv table files. A lookup has no single
# content blob, so the backup synthesizes a `definition` string from the config
# (type/filename/collection/external_cmd/fields) for the content card + version
# diff. The endpoint's own `type` (file|kvstore|external|geo) collides with the
# KO `type` discriminator, so it is renamed lookup_type first.
[ko_lookups_backup]
search = | rest /servicesNS/-/-/data/transforms/lookups splunk_server=local \
```WHAT: point-in-time snapshot of every lookup DEFINITION (not the .csv or KV-store contents), one summary event per KO version. The REST call is the source of truth; _time is set to the KO's own updated timestamp further down, which is what turns this index into an append-only version log rather than a log of when the search ran.``` \
| rename type as lookup_type \
| eval definition="type=".lookup_type . if(isnotnull(filename) AND filename!="",", filename=".filename,"") . if(isnotnull(collection) AND collection!="",", collection=".collection,"") . if(isnotnull(external_cmd) AND external_cmd!="",", external_cmd=".external_cmd,"") . if(isnotnull(fields_list) AND fields_list!="",", fields=".fields_list,"") \
| table updated title definition filename lookup_type collection external_cmd fields_list case_sensitive_match eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="lookup" \
```EPOCH-0: Splunk reports 1970 for a KO that has never been edited, and strptime returns null for it rather than 0. Either way there is no usable timestamp, so the backup stamps those at 2010-01-01Z (epoch 1262304000). That date is an EXCLUSION SENTINEL, not a guess at when the KO was made: its job is to be older than the ko_backup_window so the `where updated>now` clause below drops the row, which is what stops a never-edited KO being re-captured every 15 minutes forever. It has to be FIXED rather than relative (a drifting value would stamp the same KO differently on each run) and recent enough to survive frozenTimePeriodInSecs, which is 20 years in the shipped indexes.conf, so 2010 stops being safe around 2030. The backfill uses now() instead, because capturing exactly those never-edited KOs is the entire point of a backfill. Parse FIRST and test the epoch: an earlier version string-matched "1970-01-01T01:00:00+01:00", which only ever matched on a UTC+1 instance and silently did nothing everywhere else. The FORMAT carries the same trap: it must be "%Y-%m-%dT%H:%M:%S%:z" with NO literal + before %:z. A + there matches only a positive offset, so on any instance west of UTC every row fails to parse, every KO falls to this branch, and the search indexes nothing at all — with no error anywhere. %:z on its own parses +02:00, -04:00 and +00:00 alike (verified on Splunk 10.4).``` \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S%:z") \
| eval updated=if(isnull(updated) OR updated<=0,1262304000,updated) \
| eval _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
```INCREMENTAL: this is the whole reason the search is cheap. Only KOs edited since now minus the ko_backup_window macro are written. Widening the window without widening the cron interval re-indexes the same version on every run.``` \
| where updated>now \
| table _time updated title definition filename lookup_type collection external_cmd fields_list case_sensitive_match type appName sharing owner
description = Incremental snapshot of every lookup DEFINITION updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /data/transforms/lookups. Synthesizes `definition` from the config so the generic ko_viewer card + version diff work. The endpoint `type` is renamed lookup_type to free `type` for the KO discriminator. Window controlled by the `ko_backup_window` macro (default 900 s). NB the .csv FILE contents are not captured, only the definition stanza.
cron_schedule = 12,27,42,57 * * * *
