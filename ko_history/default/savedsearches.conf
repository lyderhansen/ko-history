| eventstats min(updated) as earliest_edit \
| eval updated=if(isnull(updated) OR updated<=0,coalesce(relative_time(earliest_edit,"@y")+1,now()),updated) \
| eval _time=updated, updated=strftime(updated,"%F %T") \
| table _time updated title definition type appName sharing owner \
```PROVENANCE: marks every row this one-time seed writes, so seeded snapshots stay distinguishable from versions actually observed by the incremental backup. Backup events carry no `backfill` field at all, so `backfill=1` and `NOT backfill=*` are the two halves.``` \
| eval backfill=1 \
```Running this SPL by hand does not summary-index it: the action.summary_index setting below only applies when Splunk runs the saved search. To seed the index from a manual run, uncomment the next line. Do not uncomment it for the scheduled path, or every event is written twice.``` \
```| collect index=`ko_history_index` source=ko_tags_backup```
description = ONE-TIME backfill. Run manually ONCE after install to seed index=ko_history with a snapshot of EVERY current tags (the incremental ko_tags_backup only captures KOs edited after install, so a never-edited KO deleted later would have no snapshot). Writes to the same summary source as the backup. Never-updated KOs are stamped at run time. Leave DISABLED and DO NOT schedule, because there is no dedup, so re-running duplicates snapshots.
disabled = 1
enableSched = 0
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_tags_backup
