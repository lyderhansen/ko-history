# KO History — Knowledge Object versioning saved searches
#
# Everything feeds `index=ko_history`. KO TYPE is the discriminator (the `type`
# field), NOT the summary source (it was, before the audits merged):
#   ko_<type>_backup        — incremental snapshot of every changed KO of <type>,
#                             one per type: views / reports_and_alerts / macros /
#                             eventtypes / fieldextractions / lookups / tags.
#                             Sets `type` on each event. Scheduled, summary-indexed.
#                             Ships DISABLED — admin enables each search after
#                             creating the ko_history index (see README/DEPLOY.md).
#   ko_all_delete_audit     — ONE search capturing DELETE/MOVE for ALL types from
#                             the _internal access logs; derives `type` from the
#                             URI. Ships DISABLED alongside the backup searches.
#                             Supersedes the 7 per-type ko_<type>_delete_audit
#                             searches (removed from this file; preserved in git
#                             history; historic events still classify because the
#                             dashboard BASE back-fills `type` from `source`).
#   ko_<type>_backfill      — one-time onboarding seed (disabled; run once).
#                             Generated by tools/gen_backfill_searches.py.
# Cron offsets are staggered so the searches don't compete for scheduler slots.

# ─── Views (Dashboards) ────────────────────────────────────────────────

[ko_views_xml_backup]
search = | rest /servicesNS/-/-/data/ui/views splunk_server=local \
| table updated label title eai:type eai:appName eai:acl.sharing eai:acl.owner eai:data \
| rename eai:* as * acl.* as * \
| search NOT (title="kohist_*" OR title="dashboard_preview_slot*") \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated label title type appName sharing owner data
description = Incremental snapshot of every dashboard updated in the last 15 minutes. Runs every 15 minutes; the `where updated>now` clause is what makes it incremental — the window is controlled by the `ko_backup_window` macro (default 900 s); do not widen without widening the cron interval, or the same version will be summary-indexed repeatedly.
cron_schedule = 3,18,33,48 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_views_xml_backup

# ─── Reports & Alerts (Saved Searches) ─────────────────────────────────

# Whitelist (explicit, so the captured schema is auditable). Field groups,
# mapped to the report_card viz sections that consume them:
#   identity   — title description type appName sharing owner disabled is_scheduled is_visible
#   definition — search dispatch.earliest_time dispatch.latest_time
#   schedule   — cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule
#   actions    — actions (CSV index of active action names — drives which sub-cards render)
#   email      — action.email{,.to,.cc,.bcc,.from,.subject,.message.alert,.sendresults,.inline,.format}
#   script     — action.script{,.filename}
#   webhook    — action.webhook{,.param.url}
#   summary    — action.summary_index{,._name} + action.summary_index.* (extra keys are user-defined,
#                e.g. _cam/_cam_workers — kept as a wildcard because they can't be enumerated)
#   alert      — alert_type alert_comparator alert_threshold alert_condition
#                alert.{severity,expires,track,digest_mode,suppress,suppress.fields,suppress.period}
# NOT captured: params of custom alert actions beyond the four above (slack, pagerduty, servicenow…).
# Their NAMES still appear in `actions`, but their params are not whitelisted — add groups here if needed.
[ko_reports_and_alerts_backup]
search = | rest /servicesNS/-/-/saved/searches splunk_server=local \
| table updated title description eai:acl.owner eai:acl.app eai:acl.sharing \
        disabled is_scheduled is_visible search dispatch.earliest_time dispatch.latest_time \
        cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule \
        actions \
        action.email action.email.to action.email.cc action.email.bcc action.email.from action.email.subject action.email.message.alert action.email.sendresults action.email.inline action.email.format \
        action.script action.script.filename \
        action.webhook action.webhook.param.url \
        action.summary_index action.summary_index._name action.summary_index.* \
        alert_type alert_comparator alert_threshold alert_condition \
        alert.severity alert.expires alert.track alert.digest_mode alert.suppress alert.suppress.fields alert.suppress.period \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="savedsearch" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title description type appName sharing owner \
        disabled is_scheduled is_visible search dispatch.earliest_time dispatch.latest_time \
        cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule \
        actions \
        action.email action.email.to action.email.cc action.email.bcc action.email.from action.email.subject action.email.message.alert action.email.sendresults action.email.inline action.email.format \
        action.script action.script.filename \
        action.webhook action.webhook.param.url \
        action.summary_index action.summary_index._name action.summary_index.* \
        alert_type alert_comparator alert_threshold alert_condition \
        alert.severity alert.expires alert.track alert.digest_mode alert.suppress alert.suppress.fields alert.suppress.period
description = Incremental snapshot of every saved search (report / alert) updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /saved/searches. The | table whitelist is explicit (auditable) except action.summary_index.* which captures user-defined summary fields. Window controlled by the `ko_backup_window` macro (default 900 s).
cron_schedule = 6,21,36,51 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_reports_and_alerts_backup

# ─── Macros (Phase 3) ──────────────────────────────────────────────────
#
# A macro has no XML blob and no schedule — its "content" is the `definition`
# (the SPL it expands to) plus `args`/`iseval`. So the captured schema is small,
# and the drilldown renders it through the GENERIC ko_viewer card (type="macro"),
# not the saved-search profile. The macro `title` carries its arg count in
# parens (e.g. `my_macro(2)`) exactly as the REST endpoint returns it — that
# string is the macros.conf stanza name, so it both identifies the macro and
# matches the delete-audit URI.
[ko_macros_backup]
search = | rest /servicesNS/-/-/admin/macros splunk_server=local \
| eval title=coalesce(title,name) \
| table updated title definition args iseval eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="macro" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title definition args iseval type appName sharing owner
description = Incremental snapshot of every search macro updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /admin/macros. Captures definition/args/iseval + ACL; type="macro" routes the drilldown to the generic ko_viewer card. Window controlled by the `ko_backup_window` macro (default 900 s). NB: relies on the REST `updated` field being the macro's edit time — if macros never get captured after an edit, that field is unreliable on this build and the incremental strategy needs revisiting (content-hash dedup).
cron_schedule = 9,24,39,54 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_macros_backup

# ─── Event types (Phase 3) ─────────────────────────────────────────────
#
# An event type's "content" is its defining `search`; priority/tags/color are
# metadata. type="eventtype" routes the drilldown to the generic ko_viewer card
# (which surfaces `search` as the primary content field, exactly like a macro's
# definition).
[ko_eventtypes_backup]
search = | rest /servicesNS/-/-/saved/eventtypes splunk_server=local \
| table updated title search description priority disabled tags color eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="eventtype" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title search description priority disabled tags color type appName sharing owner
description = Incremental snapshot of every event type updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /saved/eventtypes. Content = the defining search; type="eventtype" routes to the generic ko_viewer card. Window controlled by the `ko_backup_window` macro (default 900 s).
cron_schedule = 11,26,41,56 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_eventtypes_backup

# ─── Field extractions (Phase 3) ───────────────────────────────────────
#
# The props.conf field extractions (Settings > Fields > Field extractions). Each
# entry's `value` is its content: the inline regex (EXTRACT-) or the transform
# name it references (REPORT-). NB the REST endpoint returns a field literally
# named `type` (Inline | Uses transform) — that collides with our KO `type`
# discriminator, so it is renamed to `extract_kind` before we set type=
# "fieldextraction". title = "<stanza> : <attribute>" (URL-decoded in BASE via
# the %20/%3A rules, so the audit URI joins back to the backup). Transform regex
# bodies (transforms.conf) are NOT captured here — this is the props view only.
[ko_fieldextractions_backup]
search = | rest /servicesNS/-/-/data/props/extractions splunk_server=local \
| rename type as extract_kind \
| table updated title value extract_kind attribute stanza eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="fieldextraction" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title value extract_kind attribute stanza type appName sharing owner
description = Incremental snapshot of every props.conf field extraction updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /data/props/extractions. Content = `value` (inline regex or transform ref); the endpoint's `type` (Inline/Uses transform) is renamed extract_kind to free `type` for the KO discriminator (fieldextraction → generic ko_viewer card). Window controlled by the `ko_backup_window` macro (default 900 s).
cron_schedule = 13,28,43,58 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_fieldextractions_backup

# ─── Lookups (Phase 3) ─────────────────────────────────────────────────
#
# The lookup DEFINITIONS (Settings > Lookups > Lookup definitions), i.e.
# /data/transforms/lookups — NOT the raw .csv table files. A lookup has no single
# content blob, so the backup synthesizes a `definition` string from the config
# (type/filename/collection/external_cmd/fields) for the content card + version
# diff. The endpoint's own `type` (file|kvstore|external|geo) collides with the
# KO `type` discriminator, so it is renamed lookup_type first.
[ko_lookups_backup]
search = | rest /servicesNS/-/-/data/transforms/lookups splunk_server=local \
| rename type as lookup_type \
| eval definition="type=".lookup_type . if(isnotnull(filename) AND filename!="",", filename=".filename,"") . if(isnotnull(collection) AND collection!="",", collection=".collection,"") . if(isnotnull(external_cmd) AND external_cmd!="",", external_cmd=".external_cmd,"") . if(isnotnull(fields_list) AND fields_list!="",", fields=".fields_list,"") \
| table updated title definition filename lookup_type collection external_cmd fields_list case_sensitive_match eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="lookup" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title definition filename lookup_type collection external_cmd fields_list case_sensitive_match type appName sharing owner
description = Incremental snapshot of every lookup DEFINITION updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /data/transforms/lookups. Synthesizes `definition` from the config so the generic ko_viewer card + version diff work. The endpoint `type` is renamed lookup_type to free `type` for the KO discriminator. Window controlled by the `ko_backup_window` macro (default 900 s). NB the .csv FILE contents are not captured — only the definition stanza.
cron_schedule = 12,27,42,57 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_lookups_backup

# ─── Tags (Phase 3) ────────────────────────────────────────────────────
#
# tags.conf assignments via /configs/conf-tags. Each stanza is a "<field>=<value>"
# pair, and the tag names are dynamic columns whose value is "enabled"/"disabled".
# `foreach *` collapses the enabled tag names into a synthesized `definition`
# (space-separated) so the content card + version diff have something to show and
# hash. title = the "<field>=<value>" stanza.
[ko_tags_backup]
search = | rest /servicesNS/-/-/configs/conf-tags splunk_server=local \
| eval _e="" \
| foreach * [ eval _e=if('<<FIELD>>'="enabled", _e."<<FIELD>> ", _e) ] \
| eval definition=trim(_e) \
| rex mode=sed field=title "s/%3A/:/g" \
| table updated title definition eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="tag" \
| eval updated=if(updated="1970-01-01T01:00:00+01:00","2010-01-01T01:00:00+01:00",updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
| where updated>now \
| table _time updated title definition type appName sharing owner
description = Incremental snapshot of every tags.conf assignment updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /configs/conf-tags. `foreach *` synthesizes `definition` = the enabled tag names for the "<field>=<value>" stanza, so the generic ko_viewer card + version diff work. Window controlled by the `ko_backup_window` macro (default 900 s). NB the foreach iterates all columns incl. meta — only those literally ="enabled" are kept.
cron_schedule = 0,15,30,45 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_tags_backup

# ─── Combined ALL-KO delete audit (replaces the 7 per-type audits) ─────
#
# Single delete/move audit for EVERY KO type. Unions every KO delete/move URI
# pattern from the _internal access logs, derives `type` from the URI (so the
# dashboard discriminates by `type`, not per-type summary `source`), and writes
# the object name into `file` (URL-encoded; the dashboard BASE decodes it). One
# summary `source` = ko_all_delete_audit. This replaces ko_*_delete_audit (removed
# from this file; preserved in git history); their historical events still classify
# because BASE back-fills `type` from the old source names.
[ko_all_delete_audit]
search = (index=_internal method=delete (uri=*data/ui/views* OR uri=*saved/searches* OR uri=*saved/eventtypes* OR uri=*admin/macros* OR uri=*configs/conf-macros* OR uri=*data/macros* OR uri=*data/props/extractions* OR uri=*data/transforms/lookups* OR uri=*configs/conf-tags* OR uri=*admin/tags*)) \
    OR (index=_internal POST move (uri=*data/ui/views* OR uri=*saved/searches* OR uri=*saved/eventtypes* OR uri=*admin/macros* OR uri=*data/props/extractions* OR uri=*data/transforms/lookups* OR uri=*configs/conf-tags*)) \
| eval type=case(match(uri,"data/ui/views"),"views", match(uri,"saved/searches"),"savedsearch", match(uri,"saved/eventtypes"),"eventtype", match(uri,"admin/macros|conf-macros|data/macros"),"macro", match(uri,"data/props/extractions"),"fieldextraction", match(uri,"data/transforms/lookups"),"lookup", match(uri,"configs/conf-tags|admin/tags"),"tag", true(),"unknown") \
| rex field=uri "(?:data/ui/views|saved/searches|saved/eventtypes|admin/macros|conf-macros|data/macros|data/props/extractions|data/transforms/lookups|configs/conf-tags|admin/tags)/(?<ko_name>[^/?]+)" \
| rex field=uri "/servicesNS/[^/]+/(?<app>[^/]+)/" \
| eval method=if(file="move",upper(file),upper(method)) \
| eval file=coalesce(ko_name,file) \
| search NOT (file="kohist_*" OR file="dashboard_preview_slot*") \
| table _time type file method user host status uri app
description = ALL-KO delete and move audit. Single search replacing the 7 per-type ko_*_delete_audit searches: unions every KO delete/move URI pattern from the _internal access logs, derives `type` and the `app` (the /servicesNS/<owner>/<app>/ segment) from the URI and writes the object name to `file`. The `app` field is essential — the dashboard filters every row by appName, so delete/move events without it are dropped (the BASE coalesces appName,app). Summary-indexed (source=ko_all_delete_audit); the dashboard discriminates by `type`. Runs hourly over the previous hour.
cron_schedule = 23 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_all_delete_audit

# ─── KO tracked-KOs lookup builder ──────────────────────────────────────
#
# Builds the ko_tracked_kos.csv membership lookup incrementally: searches only
# the last 25h of ko_history events (cheap — avoids an earliest=0 full-index
# scan), accumulates (type, title) pairs with append=t so previously-seen KOs
# are never lost, then deduplicates counts. The collector (ko_usage_collector)
# uses this lookup to filter usage rows to known tracked KOs — replacing the
# slow earliest=0 join. Runs 30 minutes before ko_usage_collector (01:00 daily).
[ko_tracked_kos_lookup_builder]
search = index=ko_history earliest=-25h (source=ko_views_xml_backup OR source=ko_reports_and_alerts_backup) \
| eval type=coalesce(type,"views"), title=coalesce(title,file) \
| stats count by type title \
| inputlookup append=t ko_tracked_kos.csv \
| stats sum(count) as count by type title \
| outputlookup ko_tracked_kos.csv
description = Incrementally builds the ko_tracked_kos membership lookup from a 25h window of ko_history backup events; accumulates across runs via append=t so KOs seen in earlier days are never dropped. Runs 30 minutes before ko_usage_collector so the lookup is warm. Enabled; safe to schedule (only reads a bounded 25h window; never does earliest=0).
cron_schedule = 0 1 * * *
dispatch.earliest_time = -25h
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1

# ─── KO usage collector (Task #50) ─────────────────────────────────────
#
# Daily per-KO usage, summary-indexed into ko_history under source=ko_usage (the
# KO queries exclude that source; only the stats panel reads it). Two sources:
# dashboard page views from _internal splunk_web_access, and saved-search runs
# from _audit. Captures the PREVIOUS full day each run, so the stats table sums
# usage over time (forward-looking from when this collector is enabled). access_
# count = views/runs that day; users = distinct users that day.
# Membership filter uses ko_tracked_kos lookup (built by ko_tracked_kos_lookup_builder)
# instead of an earliest=0 join subsearch — avoids full-index rescan and join
# truncation (~50k rows silently dropped as the index grows).
[ko_usage_collector]
search = index=_internal sourcetype=splunk_web_access uri_path="/*/app/*" \
| rex field=uri_path "/app/(?<appName>[^/]+)/(?<title>[^/?]+)" \
| stats count as access_count dc(user) as users by appName title \
| eval type="views", scheduled_runs=0 \
| append [ search index=_audit action=search info=completed savedsearch_name=* NOT savedsearch_name=ds_* NOT savedsearch_name="" \
    | stats sum(eval(if(search_type="ad-hoc",1,0))) as access_count sum(eval(if(search_type="scheduled",1,0))) as scheduled_runs dc(eval(if(search_type="ad-hoc",user,null()))) as users by savedsearch_name \
    | rename savedsearch_name as title \
    | eval type="savedsearch" ] \
| lookup ko_tracked_kos type title OUTPUT count as _tracked \
| where isnotnull(_tracked) \
| fields - _tracked \
| fillnull value=0 access_count scheduled_runs users \
| table type appName title access_count scheduled_runs users
description = Daily per-KO usage collector (Task #50), differentiating ACCESS (human) from SCHEDULED (automated). access_count = human interaction: dashboard page views (_internal splunk_web_access) + ad-hoc saved-search runs (_audit search_type=ad-hoc). scheduled_runs = automated saved-search executions (_audit search_type=scheduled — these would otherwise dominate and include KO History's own backups, so they are a SEPARATE metric, not folded into access). Membership filter uses | lookup ko_tracked_kos (built daily by ko_tracked_kos_lookup_builder) instead of an earliest=0 join — O(lookup) vs O(index), no truncation. Summary-indexed to ko_history under source=ko_usage; only the statistics panel reads it. Captures the previous full day.
cron_schedule = 30 1 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_usage

# === BEGIN GENERATED BACKFILL SEARCHES (tools/gen_backfill_searches.py) ===
#
# Generated from the [ko_*_backup] stanzas above — do not edit by hand;
# run tools/gen_backfill_searches.py to regenerate.

[ko_views_xml_backfill]
search = | rest /servicesNS/-/-/data/ui/views splunk_server=local \
| table updated label title eai:type eai:appName eai:acl.sharing eai:acl.owner eai:data \
| rename eai:* as * acl.* as * \
| search NOT (title="kohist_*" OR title="dashboard_preview_slot*") \
| eval updated=if(updated="1970-01-01T01:00:00+01:00",strftime(now(),"%Y-%m-%dT%H:%M:%S+%:z"),updated) \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S+%:z"), _time=updated, updated=strftime(updated,"%F %T") \
| table _time updated label title type appName sharing owner data
description = ONE-TIME backfill — run manually ONCE after install to seed index=ko_history with a snapshot of EVERY current views xml (the incremental ko_views_xml_backup only captures KOs edited after install, so a never-edited KO deleted later would have no snapshot). Writes to the same summary source as the backup. Never-updated KOs are stamped at run time. Leave DISABLED and DO NOT schedule — there is no dedup, so re-running duplicates snapshots.
disabled = 1
enableSched = 0
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_views_xml_backup

[ko_reports_and_alerts_backfill]
search = | rest /servicesNS/-/-/saved/searches splunk_server=local \
| table updated title description eai:acl.owner eai:acl.app eai:acl.sharing \
        disabled is_scheduled is_visible search dispatch.earliest_time dispatch.latest_time \
