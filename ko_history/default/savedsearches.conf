# KO History — Knowledge Object versioning saved searches
#
# Everything feeds `index=ko_history`. KO TYPE is the discriminator (the `type`
# field), NOT the summary source (it was, before the audits merged):
#   ko_<type>_backup        — incremental snapshot of every changed KO of <type>,
#                             one per type: views / reports_and_alerts / macros /
#                             eventtypes / fieldextractions / lookups / tags.
#                             Sets `type` on each event. Scheduled, summary-indexed.
#                             Ships DISABLED — admin enables each search after
#                             creating the ko_history index (see README/DEPLOY.md).
#   ko_all_delete_audit     — ONE search capturing DELETE/MOVE for ALL types from
#                             the _internal access logs; derives `type` from the
#                             URI. Ships DISABLED alongside the backup searches.
#                             Supersedes the 7 per-type ko_<type>_delete_audit
#                             searches (removed from this file; preserved in git
#                             history; historic events still classify because the
#                             dashboard BASE back-fills `type` from `source`).
#   ko_<type>_backfill      — one-time onboarding seed (disabled; run once).
#                             Generated by tools/gen_backfill_searches.py.
# Cron offsets are staggered so the searches don't compete for scheduler slots.

# ─── Views (Dashboards) ────────────────────────────────────────────────

[ko_views_xml_backup]
search = | rest /servicesNS/-/-/data/ui/views splunk_server=local \
```WHAT: point-in-time snapshot of every dashboard, Simple XML and Dashboard Studio alike, one summary event per KO version. The REST call is the source of truth; _time is set to the KO's own updated timestamp further down, which is what turns this index into an append-only version log rather than a log of when the search ran.``` \
| table updated label title eai:type eai:appName eai:acl.sharing eai:acl.owner eai:data \
| rename eai:* as * acl.* as * \
```EXCLUDE: the wrapper's scratch preview slots are real views, so without this they would be captured as if they were user content.``` \
| search NOT (title="kohist_*" OR title="dashboard_preview_slot*") \
```EPOCH-0: Splunk reports 1970 for a KO that has never been edited, and strptime returns null for it rather than 0. Either way there is no usable timestamp, so the backup stamps those at 2010-01-01Z (epoch 1262304000). That date is an EXCLUSION SENTINEL, not a guess at when the KO was made: its job is to be older than the ko_backup_window so the `where updated>now` clause below drops the row, which is what stops a never-edited KO being re-captured every 15 minutes forever. It has to be FIXED rather than relative (a drifting value would stamp the same KO differently on each run) and recent enough to survive frozenTimePeriodInSecs, which is 20 years in the shipped indexes.conf, so 2010 stops being safe around 2030. The backfill uses now() instead, because capturing exactly those never-edited KOs is the entire point of a backfill. Parse FIRST and test the epoch: an earlier version string-matched "1970-01-01T01:00:00+01:00", which only ever matched on a UTC+1 instance and silently did nothing everywhere else. The FORMAT carries the same trap: it must be "%Y-%m-%dT%H:%M:%S%:z" with NO literal + before %:z. A + there matches only a positive offset, so on any instance west of UTC every row fails to parse, every KO falls to this branch, and the search indexes nothing at all — with no error anywhere. %:z on its own parses +02:00, -04:00 and +00:00 alike (verified on Splunk 10.4).``` \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S%:z") \
| eval updated=if(isnull(updated) OR updated<=0,1262304000,updated) \
| eval _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
```INCREMENTAL: this is the whole reason the search is cheap. Only KOs edited since now minus the ko_backup_window macro are written. Widening the window without widening the cron interval re-indexes the same version on every run.``` \
| where updated>now \
| table _time updated label title type appName sharing owner data
description = Incremental snapshot of every dashboard updated in the last 15 minutes. Runs every 15 minutes; the `where updated>now` clause is what makes it incremental. The window is controlled by the `ko_backup_window` macro (default 900 s); do not widen without widening the cron interval, or the same version will be summary-indexed repeatedly.
cron_schedule = 3,18,33,48 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_views_xml_backup

# ─── Reports & Alerts (Saved Searches) ─────────────────────────────────

# Whitelist (explicit, so the captured schema is auditable). Field groups,
# mapped to the report_card viz sections that consume them:
#   identity   — title description type appName sharing owner disabled is_scheduled is_visible
#   definition — search dispatch.earliest_time dispatch.latest_time
#   schedule   — cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule
#   actions    — actions (CSV index of active action names — drives which sub-cards render)
#   email      — action.email{,.to,.cc,.bcc,.from,.subject,.message.alert,.sendresults,.inline,.format}
#   script     — action.script{,.filename}
#   webhook    — action.webhook{,.param.url}
#   summary    — action.summary_index{,._name} + action.summary_index.* (extra keys are user-defined,
#                e.g. _cam/_cam_workers — kept as a wildcard because they can't be enumerated)
#   alert      — alert_type alert_comparator alert_threshold alert_condition
#                alert.{severity,expires,track,digest_mode,suppress,suppress.fields,suppress.period}
# NOT captured: params of custom alert actions beyond the four above (slack, pagerduty, servicenow…).
# Their NAMES still appear in `actions`, but their params are not whitelisted — add groups here if needed.
[ko_reports_and_alerts_backup]
search = | rest /servicesNS/-/-/saved/searches splunk_server=local \
```WHAT: point-in-time snapshot of every saved search, meaning reports and alerts, one summary event per KO version. The REST call is the source of truth; _time is set to the KO's own updated timestamp further down, which is what turns this index into an append-only version log rather than a log of when the search ran.``` \
| table updated title description eai:acl.owner eai:acl.app eai:acl.sharing \
        disabled is_scheduled is_visible search dispatch.earliest_time dispatch.latest_time \
        cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule \
        actions \
        action.email action.email.to action.email.cc action.email.bcc action.email.from action.email.subject action.email.message.alert action.email.sendresults action.email.inline action.email.format \
        action.script action.script.filename \
        action.webhook action.webhook.param.url \
        action.summary_index action.summary_index._name action.summary_index.* \
        alert_type alert_comparator alert_threshold alert_condition \
        alert.severity alert.expires alert.track alert.digest_mode alert.suppress alert.suppress.fields alert.suppress.period \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="savedsearch" \
```EPOCH-0: Splunk reports 1970 for a KO that has never been edited, and strptime returns null for it rather than 0. Either way there is no usable timestamp, so the backup stamps those at 2010-01-01Z (epoch 1262304000). That date is an EXCLUSION SENTINEL, not a guess at when the KO was made: its job is to be older than the ko_backup_window so the `where updated>now` clause below drops the row, which is what stops a never-edited KO being re-captured every 15 minutes forever. It has to be FIXED rather than relative (a drifting value would stamp the same KO differently on each run) and recent enough to survive frozenTimePeriodInSecs, which is 20 years in the shipped indexes.conf, so 2010 stops being safe around 2030. The backfill uses now() instead, because capturing exactly those never-edited KOs is the entire point of a backfill. Parse FIRST and test the epoch: an earlier version string-matched "1970-01-01T01:00:00+01:00", which only ever matched on a UTC+1 instance and silently did nothing everywhere else. The FORMAT carries the same trap: it must be "%Y-%m-%dT%H:%M:%S%:z" with NO literal + before %:z. A + there matches only a positive offset, so on any instance west of UTC every row fails to parse, every KO falls to this branch, and the search indexes nothing at all — with no error anywhere. %:z on its own parses +02:00, -04:00 and +00:00 alike (verified on Splunk 10.4).``` \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S%:z") \
| eval updated=if(isnull(updated) OR updated<=0,1262304000,updated) \
| eval _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
```INCREMENTAL: this is the whole reason the search is cheap. Only KOs edited since now minus the ko_backup_window macro are written. Widening the window without widening the cron interval re-indexes the same version on every run.``` \
| where updated>now \
| table _time updated title description type appName sharing owner \
        disabled is_scheduled is_visible search dispatch.earliest_time dispatch.latest_time \
        cron_schedule next_scheduled_time schedule_window schedule_priority realtime_schedule \
        actions \
        action.email action.email.to action.email.cc action.email.bcc action.email.from action.email.subject action.email.message.alert action.email.sendresults action.email.inline action.email.format \
        action.script action.script.filename \
        action.webhook action.webhook.param.url \
        action.summary_index action.summary_index._name action.summary_index.* \
        alert_type alert_comparator alert_threshold alert_condition \
        alert.severity alert.expires alert.track alert.digest_mode alert.suppress alert.suppress.fields alert.suppress.period
description = Incremental snapshot of every saved search (report / alert) updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /saved/searches. The | table whitelist is explicit (auditable) except action.summary_index.* which captures user-defined summary fields. Window controlled by the `ko_backup_window` macro (default 900 s).
cron_schedule = 6,21,36,51 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
schedule_window = auto
is_visible = 1
action.summary_index = 1
action.summary_index._name = ko_history
action.summary_index.source = ko_reports_and_alerts_backup

# ─── Macros (Phase 3) ──────────────────────────────────────────────────
#
# A macro has no XML blob and no schedule — its "content" is the `definition`
# (the SPL it expands to) plus `args`/`iseval`. So the captured schema is small,
# and the drilldown renders it through the GENERIC ko_viewer card (type="macro"),
# not the saved-search profile. The macro `title` carries its arg count in
# parens (e.g. `my_macro(2)`) exactly as the REST endpoint returns it — that
# string is the macros.conf stanza name, so it both identifies the macro and
# matches the delete-audit URI.
[ko_macros_backup]
search = | rest /servicesNS/-/-/admin/macros splunk_server=local \
```WHAT: point-in-time snapshot of every search macro, one summary event per KO version. The REST call is the source of truth; _time is set to the KO's own updated timestamp further down, which is what turns this index into an append-only version log rather than a log of when the search ran.``` \
| eval title=coalesce(title,name) \
| table updated title definition args iseval eai:acl.owner eai:acl.app eai:acl.sharing \
| rename eai:* as * acl.* as * \
| rename app as appName \
| eval type="macro" \
```EPOCH-0: Splunk reports 1970 for a KO that has never been edited, and strptime returns null for it rather than 0. Either way there is no usable timestamp, so the backup stamps those at 2010-01-01Z (epoch 1262304000). That date is an EXCLUSION SENTINEL, not a guess at when the KO was made: its job is to be older than the ko_backup_window so the `where updated>now` clause below drops the row, which is what stops a never-edited KO being re-captured every 15 minutes forever. It has to be FIXED rather than relative (a drifting value would stamp the same KO differently on each run) and recent enough to survive frozenTimePeriodInSecs, which is 20 years in the shipped indexes.conf, so 2010 stops being safe around 2030. The backfill uses now() instead, because capturing exactly those never-edited KOs is the entire point of a backfill. Parse FIRST and test the epoch: an earlier version string-matched "1970-01-01T01:00:00+01:00", which only ever matched on a UTC+1 instance and silently did nothing everywhere else. The FORMAT carries the same trap: it must be "%Y-%m-%dT%H:%M:%S%:z" with NO literal + before %:z. A + there matches only a positive offset, so on any instance west of UTC every row fails to parse, every KO falls to this branch, and the search indexes nothing at all — with no error anywhere. %:z on its own parses +02:00, -04:00 and +00:00 alike (verified on Splunk 10.4).``` \
| eval updated=strptime(updated,"%Y-%m-%dT%H:%M:%S%:z") \
| eval updated=if(isnull(updated) OR updated<=0,1262304000,updated) \
| eval _time=updated, updated=strftime(updated,"%F %T"), now=strftime(now()-`ko_backup_window`,"%F %T") \
```INCREMENTAL: this is the whole reason the search is cheap. Only KOs edited since now minus the ko_backup_window macro are written. Widening the window without widening the cron interval re-indexes the same version on every run.``` \
| where updated>now \
| table _time updated title definition args iseval type appName sharing owner
description = Incremental snapshot of every search macro updated in the last 15 minutes. Mirrors ko_views_xml_backup but targets /admin/macros. Captures definition/args/iseval + ACL; type="macro" routes the drilldown to the generic ko_viewer card. Window controlled by the `ko_backup_window` macro (default 900 s). NB: relies on the REST `updated` field being the macro's edit time. If macros never get captured after an edit, that field is unreliable on this build and the incremental strategy needs revisiting (content-hash dedup).
cron_schedule = 9,24,39,54 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
disabled = 1
realtime_schedule = 0
