# KO History — lookup table definitions

# Membership lookup: set of (type, title) pairs that are tracked KOs.
# Built incrementally by ko_tracked_kos_lookup_builder (runs daily).
# Consumed by ko_usage_collector as a filter via | lookup ... OUTPUT count as _tracked.
[ko_tracked_kos]
filename = ko_tracked_kos.csv

# Seen-set: every (type, app, title) that has ever been captured.
# Rebuilt from the index by ko_seen_kos_builder; consumed by the ko_*_catchup
# searches, which capture a KO only when it is ABSENT here.
#
# A lookup rather than a subsearch against the index on purpose. A subsearch
# caps at 10 000 rows and truncates SILENTLY, which on a large instance would
# either re-capture KOs as duplicates or skip them with no error.
[ko_seen_kos]
filename = ko_seen_kos.csv
