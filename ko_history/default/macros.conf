# KO History — SPL macros
#
# ko_backup_window
#   The lookback window (in seconds) for the incremental ko_*_backup searches.
#   The scheduled stanzas use `now()-\`ko_backup_window\`` in their eval, and the
#   cron intervals are set to match (currently 15 min = 900 s for most types).
#   If you widen this value you MUST also widen the corresponding cron intervals,
#   otherwise the same KO version will be summary-indexed on every run.

[ko_backup_window]
definition = 900
iseval = 0

# ko_history_index
#   The name of the summary index KO History reads from. Expands to the BARE
#   index name, so every search uses it as `index=\`ko_history_index\``.
#
#   Bare name, not "index=<name>", on purpose. If someone hand-edits this and
#   types just the name when the convention were "index=name", the SPL would
#   degrade to a free-text search term that silently matches everything and
#   returns plausible nonsense. With the bare-name convention the same mistake
#   produces "index=index=foo", which fails loudly. Prefer the error.
#
#   MANAGED BY THE SETTINGS PAGE. KO History: Settings writes this over REST.
#   You can edit it by hand here or on Settings > Advanced search > Search
#   macros, but see the warning below before you do.
#
#   WARNING, READ BEFORE CHANGING: this macro governs where the app READS.
#   Where it WRITES is action.summary_index._name on each capture search, which
#   is a saved-search setting and cannot use a macro. Change this alone and the
#   dashboards look at the new index while capture keeps filling the old one:
#   a working install that shows an empty table. The settings page updates both
#   together, which is why it is the recommended route.

[ko_history_index]
definition = ko_history
iseval = 0
