# KO History — summary index definition.
#
# WHY THIS INDEX NEEDS NON-DEFAULT RETENTION/QUARANTINE SETTINGS
# --------------------------------------------------------------
# KO History summary-indexes one event per knowledge-object snapshot, and it
# stamps each event at the KNOWLEDGE OBJECT'S OWN `updated` time (not at capture
# time) — that is what turns the index into an append-only *version log*. The
# consequence: an event's _time can be YEARS in the past:
#   * a dashboard / report / lookup last edited in, say, 2018, captured by a
#     backfill at its REAL updated time — this is the case that actually needs
#     the long retention, and
#   * the "never updated" fallback. REST returns epoch 0 for those, which the
#     backup searches map to 2010-01-01Z. Note this value is an EXCLUSION
#     sentinel: it is deliberately older than the capture window so the
#     incremental `where updated>now` clause DROPS the row, so in practice a
#     2010-dated event is rarely written at all. It still has to sit inside the
#     frozen period for the cases where it is, which gives it a shelf life:
#     2010 plus the 20 years below runs out in 2030.
#
# Splunk's DEFAULT index settings would quietly destroy that history:
#   * frozenTimePeriodInSecs default ~188697600 (~6 years) -> events older than
#     that are FROZEN, i.e. DELETED (unless coldToFrozenDir is set). A 2010-dated
#     snapshot (>15 years) would be deleted on roll.
# So this index sets a long frozen period — the setting that prevents DATA LOSS.
# 630720000 seconds = 20 years. Tune to your audit-retention policy in
# local/indexes.conf (this default/ stanza is the shipped baseline).
#
# QUARANTINE NOTE: Splunk also routes events whose _time is far in the past
# (quarantinePastSecs, default ~2.5y) into a separate QUARANTINE bucket. Those
# events REMAIN SEARCHABLE — they are just bucketed apart — so this does not
# lose or hide KO history in practice. Splunk Cloud's vetted indexes.conf does
# NOT permit quarantinePastSecs/quarantineFutureSecs, so they are intentionally
# omitted here. If your on-prem audit policy needs to widen the quarantine
# window, set them in local/indexes.conf (not shipped in default/).
#
# DISTRIBUTED / SPLUNK CLOUD: indexes are managed by the platform (indexer
# cluster master / ACS), not by an app-shipped indexes.conf. There, create the
# `ko_history` index through your platform tooling with equivalent retention and
# ignore (or remove) this file.

[ko_history]
homePath   = $SPLUNK_DB/ko_history/db
coldPath   = $SPLUNK_DB/ko_history/colddb
thawedPath = $SPLUNK_DB/ko_history/thaweddb
# Keep 20 years of version history (default ~6y would freeze/delete old snapshots).
frozenTimePeriodInSecs = 630720000
