# Search head cluster replication for this app's own settings.
#
# ko_history.conf is a custom conf, and custom confs are NOT replicated between
# search head cluster members by default. Without this, an admin who enables
# restore on the settings page changes it on whichever member served that
# request, and the other members keep the old value: restore ends up enabled on
# one search head and disabled on the next, depending on which one a user lands
# on.
#
# This is the fix AppInspect's check_custom_conf_replication names, and it is
# the only [shclustering] setting here: it does not configure clustering, it
# only adds one conf file to the list of things an existing cluster keeps in
# step. Harmless on a standalone search head, where there is nothing to
# replicate to.
[shclustering]
conf_replication_include.ko_history = true
