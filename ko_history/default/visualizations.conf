[dashboard_preview]
label = Dashboard Preview + Diff (Simple XML host)
description = Renders a saved dashboard (Studio or Simple XML) inline and overlays a visual diff between two versions of its source. Use inside CLASSIC SIMPLE XML dashboards (e.g. KO History > KO Version). In Dashboard Studio it shows a "not supported" notice: use the DS-host viz instead.
default_height = 600
allow_user_selection = true
disabled = 0
search_fragment = | head 2 | streamstats count as n | eval role=if(n=1,"target","baseline") | table role title data

[source_viewer]
label = Source Viewer (JSON / XML)
description = Renders any JSON or XML source string as a syntax-highlighted, line-numbered, foldable listing with a copy-to-clipboard button. Point it at any field holding JSON or XML: knowledge-object definitions, API payloads, config blobs, log fields. Sandbox-safe (pure client-side), and works inside Dashboard Studio and Simple XML alike.
default_height = 600
allow_user_selection = true
disabled = 0
search_fragment = | head 1 | table title app data

[ko_viewer]
label = KO Viewer (record card)
description = Renders one knowledge-object version as a Splunk-native record card. Saved searches (reports / alerts) get a bespoke profile: status/kind seals, Definition with copyable SPL, humanized Schedule, a chip per active Trigger Action, and an Alert Condition section. Any other KO (macros, event types, field extractions, lookups, tags, …) gets a generic profile: header, its primary definition/code field, and an all-fields Details section. DOM-based and sandbox-safe; dispatch on a Type Field.
default_height = 520
allow_user_selection = true
disabled = 0
search_fragment = | head 2
